# NATS Server Configuration for Sentry
# JetStream + WebSocket enabled

server_name: sentry-nats
port: 4222

# JetStream
jetstream {
  max_memory: 1GB
  max_file: 10GB
  store_dir: "/data/jetstream"
}

# WebSocket for live feed
websocket {
  port: 4223
  no_tls: true
}

# Monitoring
monitoring {
  port: 8222
}

# Authorization (production would use proper auth)
authorization {
  # For dev, allow anonymous
  # In production, configure proper users/permissions
}