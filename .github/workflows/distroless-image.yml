name: Build Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ClickHouse consumes NATS by configuration (see todo.metrics.md): the
      # two containers share a docker network so the NATS engine table can
      # reach nats:4222, while the job reaches both on localhost.
      - name: Start ClickHouse and NATS (JetStream)
        run: |
          docker network create benemetrics-test
          cat > /tmp/nats-server.conf <<'EOF'
          port: 4222
          http: 8222

          jetstream {
            store_dir: /data
            max_file_store: 4GB
          }

          websocket {
            port: 9222
            no_tls: true
          }
          EOF
          docker run -d --name nats --network benemetrics-test \
            -p 4222:4222 -p 8222:8222 -p 9222:9222 \
            -v /tmp/nats-server.conf:/etc/nats/nats-server.conf:ro \
            nats:latest -c /etc/nats/nats-server.conf
          docker run -d --name clickhouse --network benemetrics-test -p 8123:8123 \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            clickhouse/clickhouse-server:latest

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Wait for ClickHouse and NATS
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:8123/ping >/dev/null 2>&1; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:8222/healthz >/dev/null 2>&1; do sleep 2; done'

      - name: Smoke test JetStream -> ClickHouse ingestion
        run: bun scripts/smoke-ch-nats.ts

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test