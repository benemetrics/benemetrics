# The project name follows the repository directory (docker compose's
# default), so the volumes and the container names stay stable.
#
# The environment of the API and of the side-effects consumer. The host
# development server (bun run dev) uses the same values — the service names
# become localhost when the server runs outside compose.
x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgres://postgres:mysecretpassword@postgres:5432/sentry
  NATS_SERVERS: nats://nats:4222
  NATS_STREAM_MAX_BYTES: "1073741824"
  # The backend's NATS config user (AUTH account; also the auth-callout
  # service) and the issuer seed that signs the admission verdicts.
  NATS_AUTH_USER: ${NATS_AUTH_USER:-sentries-auth}
  NATS_AUTH_PASSWORD: ${NATS_AUTH_PASSWORD:-sentries-dev-auth-pass}
  NATS_AUTH_KEY_SEED: ${NATS_AUTH_KEY_SEED:-SAAICRLV2CKHUW4DJ4UWKWWZOXS7K4AZ7F3DWLXHXA5FUVBM2OUZ3O3ITM}
  CLICKHOUSE_NATS_USER: ${CLICKHOUSE_NATS_USER:-sentries-internal}
  CLICKHOUSE_NATS_PASSWORD: ${CLICKHOUSE_NATS_PASSWORD:-sentries-dev-internal-pass}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: default
  CLICKHOUSE_NATS_URL: nats:4222
  S3_ENDPOINT: http://rustfs:9000
  S3_BUCKET: sentry-replays
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: rustfsadmin
  S3_SECRET_ACCESS_KEY: rustfsadmin
  # Ingest rate limits (can be overridden per test)
  INGEST_RATE_LIMIT_PER_IP_PER_SEC: ${INGEST_RATE_LIMIT_PER_IP_PER_SEC:-10}
  INGEST_RATE_LIMIT_PER_FP_PER_SEC: ${INGEST_RATE_LIMIT_PER_FP_PER_SEC:-5}
  INGEST_RATE_LIMIT_GLOBAL_PER_SEC: ${INGEST_RATE_LIMIT_GLOBAL_PER_SEC:-200}
  INGEST_RATE_LIMIT_BURST_SECONDS: ${INGEST_RATE_LIMIT_BURST_SECONDS:-2}
  INGEST_MAX_ENVELOPE_BYTES: ${INGEST_MAX_ENVELOPE_BYTES:-1048576}
  INGEST_MAX_DECOMPRESSED_BYTES: ${INGEST_MAX_DECOMPRESSED_BYTES:-4194304}
  INGEST_MAX_LARGE_ENVELOPE_BYTES: ${INGEST_MAX_LARGE_ENVELOPE_BYTES:-20971520}
  INGEST_MAX_OTLP_BYTES: ${INGEST_MAX_OTLP_BYTES:-4194304}
  INGEST_MAX_ENVELOPE_ITEMS: ${INGEST_MAX_ENVELOPE_ITEMS:-100}
  INGEST_MAX_REPLAY_ITEMS: ${INGEST_MAX_REPLAY_ITEMS:-500}
  INGEST_MAX_OTLP_SPANS: ${INGEST_MAX_OTLP_SPANS:-1000}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  INGEST_BLOCK_TTL_HOURS: ${INGEST_BLOCK_TTL_HOURS:-24}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # The image restricts the passwordless `default` user to localhost when no
    # credentials are configured; skip that so the backend's defaults
    # (CLICKHOUSE_USER/PASSWORD unset) keep working in dev. Production
    # deployments terminate with real credentials.
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # JetStream buffers the ingested events until ClickHouse consumes them by
  # configuration (NATS table engine + durable pull consumer + MV); the
  # WebSocket listener is what the UI live feed subscribes to directly.
  nats:
    image: nats:latest
    environment:
      NATS_CLIENT_PORT: "4222"
      NATS_MONITOR_PORT: "8222"
      NATS_WEBSOCKET_PORT: "9222"
      NATS_STORE_DIR: /data
      NATS_MAX_FILE_STORE: 4GB
      # Auth callout: the backend answers every non-config-user connection
      # (see docs/nats.md). The issuer keypair is dev material; production
      # generates its own pair.
      NATS_AUTH_USER: ${NATS_AUTH_USER:-sentries-auth}
      NATS_AUTH_PASSWORD: ${NATS_AUTH_PASSWORD:-sentries-dev-auth-pass}
      NATS_INTERNAL_USER: ${CLICKHOUSE_NATS_USER:-sentries-internal}
      NATS_INTERNAL_PASSWORD: ${CLICKHOUSE_NATS_PASSWORD:-sentries-dev-internal-pass}
      NATS_AUTH_ISSUER: ${NATS_AUTH_ISSUER:-ABXKA3OBISZQTV5R2PFJ32RIYZAWKGFEKODJ76RMD7JGMGVGL6D6HT3W}
    configs:
      - source: nats-server
        target: /etc/nats/nats-server.conf
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222" # clients
      - "8222:8222" # monitoring
      - "9222:9222" # WebSocket (UI live feed)
    volumes:
      - nats_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    ports:
      - "9100:9000" # S3 API (9100 because ClickHouse publishes 9000)
      - "9101:9001" # web console (rustfsadmin / rustfsadmin)
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # RustFS runs as UID 10001; the named volumes need matching ownership.
  rustfs-perms:
    image: alpine
    command: chown -R 10001:10001 /data /app/logs
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs

  # Creates the bucket the backend offloads replay segments to and allows
  # the UI to fetch the presigned segment URLs (GET/HEAD) cross-origin;
  # safe to re-run (existing objects and rules are replaced idempotently).
  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin; do sleep 1; done;
      until rc ls local/ >/dev/null 2>&1; do sleep 1; done;
      rc ls local/sentry-replays >/dev/null 2>&1 || rc mb local/sentry-replays;
      tries=0;
      until rc bucket cors list local/sentry-replays 2>/dev/null | grep -q 'Allowed origins'; do
        tries=$((tries+1));
        if [ $tries -gt 3 ]; then echo 'CORS rule did not persist'; exit 1; fi;
        printf '%s' '{\"rules\":[{\"allowedOrigins\":[\"*\"],\"allowedMethods\":[\"GET\",\"HEAD\"],\"allowedHeaders\":[\"*\"],\"exposeHeaders\":[\"ETag\",\"Content-Length\",\"Content-Type\"],\"maxAgeSeconds\":3000}]}' | rc bucket cors set local/sentry-replays -;
        sleep 1;
      done;
      "

  # Keycloak: the local identity provider. The realm (the clients, the
  # groups and the test user) is imported from the config below.
  #
  # It speaks plain HTTP — a local provider has no secret to protect. HTTPS
  # is the recommendation for a real one: the issuer URL is what the backend
  # and the browser agree on, so it must match the provider's own URL.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/realm.json
    ports:
      - "8080:8080"

  # The API and the UI. Serves them on http://localhost:31337/ui.
  backend:
    build: .
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_started
      nats:
        condition: service_started
      rustfs-init:
        condition: service_completed_successfully
    environment:
      <<: *app-environment
      PORT: "31337"
    ports:
      - "31337:31337"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # The side-effects consumer: it applies the Postgres transitions (issues,
  # alerts, releases) from the durable JetStream pull consumer.
  #
  # It waits for the API to be healthy: both apply the Postgres migrations at
  # boot, and two concurrent migrators collide.
  consumer:
    build: .
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: *app-environment
    command: ["bun", "consumer.js"]
    # The consumer serves no HTTP: the image healthcheck probes the API.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  nats_data:
  rustfs_data:
  rustfs_logs:

configs:
  # The NATS server configuration. The values come from the environment of
  # the service, so the ports live in one place.
  nats-server:
    content: |
      port: $$NATS_CLIENT_PORT
      http: $$NATS_MONITOR_PORT

      jetstream {
        store_dir: $$NATS_STORE_DIR
        max_file_store: $$NATS_MAX_FILE_STORE
      }

      websocket {
        port: $$NATS_WEBSOCKET_PORT
        no_tls: true
      }

      # Everything shares the global account; the isolation is the callout's
      # per-user claim (sub-only, app shards) — docs/nats.md. The config
      # users bypass the callout: the backend is the auth service itself and
      # the ClickHouse engine is a deployment-internal consumer.
      authorization {
        users: [
          { user: $$NATS_AUTH_USER, password: $$NATS_AUTH_PASSWORD }
          { user: $$NATS_INTERNAL_USER, password: $$NATS_INTERNAL_PASSWORD }
        ]
        auth_callout {
          issuer: $$NATS_AUTH_ISSUER
          auth_users: [ $$NATS_AUTH_USER, $$NATS_INTERNAL_USER ]
        }
      }

  # The Keycloak realm: the SPA client, the backend client, the groups and
  # the test user.
  keycloak-realm:
    content: |
      {
        "realm": "benemetrics",
        "enabled": true,
        "sslRequired": "none",
        "registrationAllowed": false,
        "loginWithEmailAllowed": true,
        "duplicateEmailsAllowed": false,
        "resetPasswordAllowed": true,
        "clients": [
          {
            "clientId": "benemetrics",
            "name": "Benemetrics SPA",
            "enabled": true,
            "publicClient": true,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": false,
            "redirectUris": ["http://localhost:*/*", "http://127.0.0.1:*/*"],
            "webOrigins": ["*"],
            "attributes": {
              "pkce.code.challenge.method": "S256",
              "post.logout.redirect.uris": "http://localhost:*/*"
            },
            "defaultClientScopes": ["profile", "email", "roles", "web-origins"],
            "optionalClientScopes": ["groups"]
          },
          {
            "clientId": "benemetrics-backend",
            "name": "Benemetrics backend",
            "enabled": true,
            "publicClient": false,
            "bearerOnly": true,
            "standardFlowEnabled": false,
            "directAccessGrantsEnabled": false,
            "serviceAccountsEnabled": false,
            "defaultClientScopes": ["groups"]
          }
        ],
        "roles": {
          "realm": [
            { "name": "backend-team" },
            { "name": "frontend-team" }
          ]
        },
        "groups": [
          {
            "name": "backend-team",
            "attributes": { "group": ["backend-team"] },
            "realmRoles": ["backend-team"]
          },
          {
            "name": "frontend-team",
            "attributes": { "group": ["frontend-team"] },
            "realmRoles": ["frontend-team"]
          }
        ],
        "users": [
          {
            "username": "sso@example.com",
            "email": "sso@example.com",
            "emailVerified": true,
            "enabled": true,
            "firstName": "SSO",
            "lastName": "User",
            "credentials": [{ "type": "password", "value": "sentry", "temporary": false }],
            "groups": ["/backend-team"]
          }
        ],
        "clientScopes": [
          {
            "name": "groups",
            "protocol": "openid-connect",
            "attributes": {
              "include.in.token.scope": "true",
              "display.on.consent.screen": "false"
            },
            "protocolMappers": [
              {
                "name": "groups",
                "protocol": "openid-connect",
                "protocolMapper": "oidc-group-membership-mapper",
                "consentRequired": false,
                "config": {
                  "claim.name": "groups",
                  "full.path": "false",
                  "id.token.claim": "true",
                  "access.token.claim": "true",
                  "userinfo.token.claim": "true"
                }
              }
            ]
          }
        ]
      }
