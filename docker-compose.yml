services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sentry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    # The image restricts the passwordless `default` user to localhost when no
    # credentials are configured; skip that so the backend's defaults
    # (CLICKHOUSE_USER/PASSWORD unset) keep working in dev. Production
    # deployments terminate with real credentials.
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  nats:
    image: nats:latest
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222" # clients
      - "8222:8222" # monitoring
      - "9222:9222" # WebSocket (UI live feed)
    volumes:
      - ./infra/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    ports:
      - "9100:9000" # S3 API (9100 because ClickHouse publishes 9000)
      - "9101:9001" # web console (rustfsadmin / rustfsadmin)
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs

  # RustFS runs as UID 10001; the named volumes need matching ownership.
  rustfs-perms:
    image: alpine
    command: chown -R 10001:10001 /data /app/logs
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/app/logs

  # Creates the bucket the backend offloads replay segments to and allows
  # the UI to fetch the presigned segment URLs (GET/HEAD) cross-origin;
  # safe to re-run (existing objects and rules are replaced idempotently).
  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin; do sleep 1; done;
      until rc ls local/ >/dev/null 2>&1; do sleep 1; done;
      rc ls local/sentry-replays >/dev/null 2>&1 || rc mb local/sentry-replays;
      printf '%s' '{\"rules\":[{\"allowedOrigins\":[\"*\"],\"allowedMethods\":[\"GET\",\"HEAD\"],\"allowedHeaders\":[\"*\"],\"exposeHeaders\":[\"ETag\",\"Content-Length\",\"Content-Type\"],\"maxAgeSeconds\":3000}]}' | rc bucket cors set local/sentry-replays -;
      "

  # Keycloak: the local identity provider. The realm (the clients, the
  # groups and the test user) is imported from infra/keycloak/realm.json.
  #
  # openid-client refuses plain-HTTP issuers, so Keycloak serves TLS with a
  # self-signed certificate the backend trusts through NODE_EXTRA_CA_CERTS
  # (infra/keycloak/tls/tls.crt). The issuer is https://localhost:8443.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    depends_on:
      keycloak-cert:
        condition: service_completed_successfully
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/tls.key
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8443:8443"
    volumes:
      - ./infra/keycloak/tls:/opt/keycloak/conf/tls:ro
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro

  # Generates the self-signed certificate Keycloak serves (the backend
  # trusts it through NODE_EXTRA_CA_CERTS).
  keycloak-cert:
    image: alpine:3
    command:
      - sh
      - -c
      - >
        apk add --no-cache openssl &&
        openssl req -x509 -newkey rsa:2048 -nodes
        -keyout /tls/tls.key -out /tls/tls.crt
        -days 3650 -subj "/CN=localhost"
        -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
    volumes:
      - ./infra/keycloak/tls:/tls

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  nats_data:
  rustfs_data:
  rustfs_logs:
