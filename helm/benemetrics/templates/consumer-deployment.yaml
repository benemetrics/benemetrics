{{- if .Values.consumer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "benemetrics.fullname" . }}-consumer
  labels:
    {{- include "benemetrics.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer
spec:
  replicas: {{ .Values.consumer.replicaCount }}
  strategy:
    # The durable pull consumer owns the events; a restart resumes where it
    # stopped, so a rolling update never loses an event.
    type: Recreate
  selector:
    matchLabels:
      {{- include "benemetrics.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        {{- include "benemetrics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: consumer
        {{- with .Values.consumer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.consumer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "benemetrics.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.consumer.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      initContainers:
        # The API and the consumer both apply the Postgres migrations at boot.
        # Waiting for the API keeps the two migrators from colliding.
        - name: wait-for-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bun
            - -e
            - |
              const url = "http://{{ include "benemetrics.fullname" . }}-backend:{{ .Values.backend.port }}/";
              for (let attempt = 1; attempt <= 120; attempt++) {
                try {
                  const response = await fetch(url, { redirect: "manual" });
                  if (response.status < 400) {
                    console.log("[wait-for-api] the API is ready");
                    process.exit(0);
                  }
                } catch {}
                await Bun.sleep(2000);
              }
              console.error("[wait-for-api] the API did not become ready");
              process.exit(1);
      containers:
        - name: consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - consumer.js
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "benemetrics.secretName" . }}
                  key: database-url
            - name: NATS_SERVERS
              value: {{ include "benemetrics.natsServers" . | quote }}
            - name: NATS_STREAM_MAX_BYTES
              value: {{ .Values.nats.streamMaxBytes | quote }}
            - name: NATS_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "benemetrics.secretName" . }}
                  key: nats-auth-user
            - name: NATS_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "benemetrics.secretName" . }}
                  key: nats-auth-password
            - name: CLICKHOUSE_HOST
              value: {{ include "benemetrics.clickhouseHost" . | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "benemetrics.secretName" . }}
                  key: clickhouse-password
            - name: CLICKHOUSE_NATS_URL
              value: {{ include "benemetrics.clickhouseNatsUrl" . | quote }}
            - name: S3_ENDPOINT
              value: {{ include "benemetrics.objectStorageEndpoint" . | quote }}
            - name: S3_BUCKET
              value: {{ .Values.objectStorage.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.objectStorage.region | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "benemetrics.secretName" . }}
                  key: object-storage-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "benemetrics.secretName" . }}
                  key: object-storage-secret-access-key
            - name: INIT_RETRY_ATTEMPTS
              value: {{ .Values.config.initRetryAttempts | quote }}
            - name: INIT_RETRY_DELAY_MS
              value: {{ .Values.config.initRetryDelayMs | quote }}
            {{- with .Values.consumer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- with .Values.consumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.consumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.consumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
