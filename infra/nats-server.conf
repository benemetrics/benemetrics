# NATS for local dev/test (docker-compose and CI).
#
# JetStream buffers ingested events and metrics until ClickHouse consumes
# them by configuration (NATS table engine + durable pull consumer + MV);
# the WebSocket listener is what the UI live feed subscribes to directly.
# See todo.metrics.md.

port: 4222
http: 8222

jetstream {
  store_dir: /data
  max_file_store: 4GB
}

websocket {
  port: 9222
  no_tls: true # dev only; production terminates TLS in front of wss
}
