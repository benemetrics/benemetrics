{{- $adminToken := include "benedebug.adminToken" . -}}
{{- $postgresPassword := include "benedebug.postgresPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "benedebug.secretName" . }}
  labels:
    {{- include "benedebug.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ $adminToken | quote }}
  postgres-password: {{ $postgresPassword | quote }}
  database-url: {{ include "benedebug.databaseUrl" (dict "context" . "password" $postgresPassword) | quote }}
  clickhouse-password: {{ .Values.clickhouse.password | quote }}
  object-storage-access-key-id: {{ include "benedebug.objectStorageAccessKeyId" . | quote }}
  object-storage-secret-access-key: {{ include "benedebug.objectStorageSecretAccessKey" . | quote }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
